[project]
name = "inject"
dynamic = ["version"]
description = "Python dependency injection framework."
license = "Apache-2.0"
readme = "README.md"
authors = [{ name = "Ivan Korobkov", email = "ivan.korobkov@gmail.com" }]
maintainers = [{ name = "Ivan Korobkov", email = "ivan.korobkov@gmail.com" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

requires-python = ">=3.11"
dependencies = []

[project.urls]
homepage = "https://github.com/ivankorobkov/python-inject"
source = "https://github.com/ivankorobkov/python-inject"
issues = "https://github.com/ivankorobkov/python-inject/issues"


[dependency-groups]
dev = [
  { include-group = "ruff" },
  { include-group = "mypy" },
  { include-group = "yamllint" },
  { include-group = "tests" },
]

ruff = ["ruff>=0.17.6"]
mypy = ["mypy>=2.4.1"]
yamllint = ["yamllint>=1.38.0"]

tests = [
  "pytest>=9.2.0",
  "pytest-cov>=7.1.0",
]

[tool.uv]
required-version = ">=0.11"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"


[tool.hatch.build.hooks.vcs]
version-file = "src/inject/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/inject"]

[tool.hatch.version]
source = "vcs"


[tool.mypy]
ignore_missing_imports = true
python_version = "3.11"
strict = true
exclude = ["tests", ".venv"]


[tool.ruff.lint]
extend-select = [
  "ANN",    # annotations
  "ICN",    # import conventions, configured below
  "TID252", # relative imports
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"] # annotations not required in tests

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
"typing" = "t"

[tool.ruff.lint.flake8-import-conventions]
banned-from = ["dataclasses", "inject", "typing"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["inject"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

####  Pytest & Coverage  ####
[tool.pytest.ini_options]
addopts = "-vvv -ra --strict-markers --strict-config"
testpaths = ["tests"]
#filterwarnings = ["error"]  # TODO(pyctrl): handle all warnings later

# Coverage configuration
[tool.coverage.run]
branch = true
[tool.coverage.report]
include_namespace_packages = true
# Regexes for lines to exclude from consideration
omit = ["*/.venv/*", "*/.uv-cache/*"]
exclude_also = [
  # Don't complain if tests don't hit defensive assertion code:
  "raise NotImplementedError",

  # Don't complain if non-runnable code isn't run:
  "if __name__ == .__main__.:",

  # Don't complain about abstract methods, they aren't run:
  "@(abc\\.)?abstractmethod",

  "if TYPE_CHECKING:",
]
